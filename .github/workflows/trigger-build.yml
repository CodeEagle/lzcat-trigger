name: Trigger Build

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Target repository (leave empty to process all enabled repos)"
        required: false
        default: ""
        type: string
      target_version:
        description: "Target upstream version to build. Leave empty for latest."
        required: false
        default: ""
        type: string
      force_build:
        description: "Force build regardless of current source version"
        required: false
        default: false
        type: boolean
      publish_to_store:
        description: "Publish generated package to LazyCat App Store"
        required: false
        default: false
        type: boolean
      check_only:
        description: "Only check whether an update is needed"
        required: false
        default: false
        type: boolean
      config_repo:
        description: "Repository holding repo configs"
        required: false
        default: "CodeEagle/lzcat-registry"
        type: string
      config_ref:
        description: "Branch or tag of the config repository"
        required: false
        default: "main"
        type: string
      artifact_repo:
        description: "Central repository to store LPK artifacts and build reports"
        required: false
        default: "CodeEagle/lzcat-artifacts"
        type: string
  repository_dispatch:
    types:
      - lzcat-build
  schedule:
    - cron: "0 */12 * * *"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
      has_targets: ${{ steps.collect.outputs.has_targets }}
      config_repo: ${{ steps.resolve.outputs.config_repo }}
      config_ref: ${{ steps.resolve.outputs.config_ref }}
      artifact_repo: ${{ steps.resolve.outputs.artifact_repo }}
    steps:
      - name: Checkout trigger repository
        uses: actions/checkout@v4

      - name: Resolve config source
        id: resolve
        env:
          INPUT_CONFIG_REPO: ${{ inputs.config_repo }}
          INPUT_CONFIG_REF: ${{ inputs.config_ref }}
        run: |
          CONFIG_REPO="${INPUT_CONFIG_REPO:-CodeEagle/lzcat-registry}"
          CONFIG_REF="${INPUT_CONFIG_REF:-main}"
          ARTIFACT_REPO="${{ inputs.artifact_repo }}"
          if [ -z "$ARTIFACT_REPO" ]; then
            ARTIFACT_REPO="CodeEagle/lzcat-artifacts"
          fi
          echo "config_repo=${CONFIG_REPO}" >> "$GITHUB_OUTPUT"
          echo "config_ref=${CONFIG_REF}" >> "$GITHUB_OUTPUT"
          echo "artifact_repo=${ARTIFACT_REPO}" >> "$GITHUB_OUTPUT"

      - name: Checkout config repository
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CONFIG_REPO: ${{ steps.resolve.outputs.config_repo }}
          CONFIG_REF: ${{ steps.resolve.outputs.config_ref }}
        run: |
          git clone --depth=1 --branch "$CONFIG_REF" "https://x-access-token:${GH_TOKEN}@github.com/${CONFIG_REPO}.git" "$RUNNER_TEMP/lzcat-config"

      - name: Collect targets
        id: collect
        env:
          CONFIG_ROOT: ${{ runner.temp }}/lzcat-config
          INPUT_TARGET_REPO: ${{ inputs.target_repo }}
          INPUT_TARGET_VERSION: ${{ inputs.target_version }}
          INPUT_FORCE_BUILD: ${{ inputs.force_build }}
          INPUT_PUBLISH_TO_STORE: ${{ inputs.publish_to_store }}
          INPUT_CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          python3 scripts/collect_targets.py

  build:
    needs: prepare
    if: needs.prepare.outputs.has_targets == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    concurrency:
      group: build-${{ matrix.target_repo }}
      cancel-in-progress: false
    uses: ./.github/workflows/update-image.yml
    with:
      config_repo: ${{ needs.prepare.outputs.config_repo }}
      config_ref: ${{ needs.prepare.outputs.config_ref }}
      artifact_repo: ${{ needs.prepare.outputs.artifact_repo }}
      config_file: ${{ matrix.config_file }}
      target_version: ${{ matrix.target_version }}
      force_build: ${{ matrix.force_build }}
      publish_to_store: ${{ matrix.publish_to_store }}
      check_only: ${{ matrix.check_only }}
    secrets: inherit
