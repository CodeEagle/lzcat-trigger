name: Update Image

on:
  workflow_call:
    inputs:
      config_repo:
        required: true
        type: string
      config_ref:
        required: true
        type: string
      config_file:
        required: true
        type: string
      artifact_repo:
        required: true
        type: string
      target_version:
        required: false
        type: string
        default: ""
      force_build:
        required: false
        type: boolean
        default: false
      publish_to_store:
        required: false
        type: boolean
        default: false
      check_only:
        required: false
        type: boolean
        default: false

jobs:
  update-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout trigger repository
        uses: actions/checkout@v4

      - name: Checkout config repository
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CONFIG_REPO: ${{ inputs.config_repo }}
          CONFIG_REF: ${{ inputs.config_ref }}
        run: |
          git clone --depth=1 --branch "$CONFIG_REF" "https://x-access-token:${GH_TOKEN}@github.com/${CONFIG_REPO}.git" "$RUNNER_TEMP/lzcat-config"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install lzc-cli
        run: npm install -g @lazycatcloud/lzc-cli

      - name: Run shared image update flow
        env:
          CONFIG_ROOT: ${{ runner.temp }}/lzcat-config
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          LZC_CLI_TOKEN: ${{ secrets.LZC_CLI_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          args=(
            --config-root "$CONFIG_ROOT"
            --config-file "${{ inputs.config_file }}"
            --artifact-repo "${{ inputs.artifact_repo }}"
          )

          if [ -n "${{ inputs.target_version }}" ]; then
            args+=(--target-version "${{ inputs.target_version }}")
          fi
          if [ "${{ inputs.force_build }}" = "true" ]; then
            args+=(--force-build)
          fi
          if [ "${{ inputs.publish_to_store }}" = "true" ]; then
            args+=(--publish-to-store)
          fi
          if [ "${{ inputs.check_only }}" = "true" ]; then
            args+=(--check-only)
          fi

          python3 scripts/run_build.py "${args[@]}"
